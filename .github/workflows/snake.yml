name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sharathgowdaur-jpg
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%2358A6FF&color_dots=%230D1117,%231F6FEB,%2358A6FF,%2379C0FF,%230D1117
            dist/snake-dark.svg?palette=github-dark&color_snake=%23A371F7&color_dots=%230D1117,%236E7681,%238B949E,%23A371F7,%2358A6FF

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}