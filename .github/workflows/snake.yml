name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: sharathgowdaur-jpg
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#58A6FF&color_dots=#0D1117,#1F6FEB,#58A6FF,#79C0FF,#F0F6FC
            dist/snake-dark.svg?palette=github-dark&color_snake=#14F195&color_dots=#0D1117,#238636,#3FB950,#56D364,#F0F6FC

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}